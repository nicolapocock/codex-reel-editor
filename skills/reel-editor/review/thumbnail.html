<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thumbnail studio · Reel editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9fc;color:#34232d;font:16px system-ui}header{padding:24px 5%;border-bottom:1px solid #eadbe2;display:flex;justify-content:space-between}a{color:inherit}main{max-width:1120px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:1fr 400px;gap:48px}h1{font-size:38px;letter-spacing:-1.5px;margin:0 0 12px}p{line-height:1.5;color:#705c66}label{display:block;font-weight:600;margin-top:18px}input,select,textarea,button{font:inherit}input:not([type=checkbox]):not([type=color]),select,textarea{width:100%;margin-top:8px;padding:10px;border:1px solid #d7c4ce;border-radius:8px;background:white}input[type=range]{padding:0!important}button{border:1px solid #d7c4ce;border-radius:8px;padding:12px;background:white;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.primary{background:#35212c;color:white}canvas{display:block;width:100%;border-radius:12px}.preview{position:sticky;top:20px;align-self:start}#samples{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}#samples button{padding:0;overflow:hidden;font-size:12px}#samples img{width:100%;display:block}#status{min-height:24px;font-size:14px}small{color:#705c66}.row{display:flex;gap:20px}.row>*{flex:1}@media(max-width:800px){main{grid-template-columns:1fr}.preview{position:static;max-width:400px;grid-row:1;margin:auto}}
</style>
<header><a href="/">← Reel review</a><span>LOCAL THUMBNAIL STUDIO</span></header>
<main><section><h1>Your reel. Its first impression.</h1><p>Choose a frame, add a headline, and download your cover. Everything stays on this computer.</p>
<label>Footage<select id="source"></select></label>
<label>Frame <output id="time">0.00s</output><input id="seek" type="range" min="0" max="1" step="0.04" value="0"></label>
<button id="suggest" disabled>Show six frame options</button><div id="samples"></div>
<label>Headline<textarea id="title" rows="3" maxlength="160" placeholder="type your headline"></textarea></label>
<div class="row"><label>Style<select id="style"><option value="shadow">Soft shadow</option><option value="panel">Cream title panel</option><option value="dark">Dark fade</option></select></label><label>Text colour<input id="color" type="color" value="#ed84b0"></label></div>
<label>Title position<input id="position" type="range" min="120" max="1500" step="10" value="440"></label>
<label>Type size<input id="size" type="range" min="48" max="150" value="108"></label>
<label>Font<select id="font"><option value="system-ui">System sans</option></select></label>
<label><input id="guides" type="checkbox" checked> Show centre crop guides (excluded from export)</label>
<p><small>The lines mark centred 3:4 and square crops. Keep your face and important words inside the crop you need.</small></p>
<div class="actions"><button id="save" disabled>Save cover settings</button><button class="primary export" data-height="1920" disabled>Download portrait PNG</button><button class="export" data-height="1440" disabled>3:4 crop</button><button class="export" data-height="1080" disabled>Square crop</button></div>
<p id="status" role="status" aria-live="polite">Loading footage…</p>
</section><aside class="preview"><canvas id="preview" width="1080" height="1920" aria-label="Thumbnail preview"></canvas></aside></main>
<video id="video" muted playsinline preload="auto" hidden></video>
<script>
const $=id=>document.getElementById(id), video=$('video'), canvas=$('preview'),ctx=canvas.getContext('2d');let config={},ready=false,busy=false,restoreTime=0;
$('title').value='';
const status=text=>$('status').textContent=text;
function draw(guides=$('guides').checked){
 ctx.clearRect(0,0,1080,1920);if(!ready)return;
 const scale=Math.max(1080/video.videoWidth,1920/video.videoHeight),w=video.videoWidth*scale,h=video.videoHeight*scale;
 ctx.drawImage(video,(1080-w)/2,(1920-h)/2,w,h);
 let size=+$('size').value;const y=+$('position').value;ctx.font=`700 ${size}px "${$('font').value}"`;ctx.textAlign='center';ctx.textBaseline='top';
 const lines=[];for(const paragraph of $('title').value.split('\n')){let line='';for(const char of paragraph){if(ctx.measureText(line+char).width>920&&line){const split=line.lastIndexOf(' ');if(split>0){lines.push(line.slice(0,split));line=line.slice(split+1)+char;}else{lines.push(line);line=char;}}else line+=char;}lines.push(line);}
 size=Math.min(size,1560/Math.max(1,lines.length)/1.12);ctx.font=`700 ${size}px "${$('font').value}"`;const height=lines.length*size*1.12,start=Math.max(120,Math.min(y,1800-height));
 if($('style').value==='dark'){const fade=ctx.createLinearGradient(0,Math.max(0,start-100),0,Math.min(1920,start+height+150));fade.addColorStop(0,'#0000');fade.addColorStop(.3,'#0009');fade.addColorStop(.75,'#0009');fade.addColorStop(1,'#0000');ctx.fillStyle=fade;ctx.fillRect(0,0,1080,1920);}
 if($('style').value==='panel'){ctx.fillStyle='#fff7f0';ctx.beginPath();ctx.roundRect(50,start-30,980,height+60,30);ctx.fill();}
 ctx.fillStyle=$('color').value;ctx.shadowColor='#0009';ctx.shadowBlur=$('style').value==='panel'?0:14;ctx.shadowOffsetY=$('style').value==='panel'?0:6;
 lines.forEach((line,i)=>ctx.fillText(line,540,start+i*size*1.12));ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 if(guides){ctx.strokeStyle='#ffffffbb';ctx.lineWidth=3;ctx.setLineDash([14,12]);[1440,1080].forEach(h=>ctx.strokeRect(20,(1920-h)/2,1040,h));ctx.setLineDash([]);}
}
function seek(t){return new Promise((resolve,reject)=>{if(Math.abs(video.currentTime-t)<.01&&video.readyState>=2)return resolve();const timer=setTimeout(()=>{cleanup();reject(Error('Frame loading timed out. Try another frame.'));},15000);function cleanup(){clearTimeout(timer);video.removeEventListener('seeked',done);}function done(){cleanup();resolve();}video.addEventListener('seeked',done);video.currentTime=t;});}
function controls(disabled){document.querySelectorAll('button,select,input,textarea').forEach(el=>el.disabled=disabled);}
video.addEventListener('loadeddata',async()=>{ready=true;$('seek').max=Math.max(0,video.duration-.1);$('seek').value=0;try{await seek(Math.min(restoreTime,+$('seek').max));restoreTime=0;$('seek').value=video.currentTime;$('time').textContent=video.currentTime.toFixed(2)+'s';controls(false);draw();status('Choose a frame and make it yours.');}catch(e){status(e.message);}});
video.addEventListener('error',()=>{ready=false;controls(true);$('source').disabled=false;status('Could not decode this video. Choose another source or convert it to H.264 MP4.');});
$('source').onchange=()=>{ready=false;controls(true);video.src='/media/'+encodeURIComponent($('source').value);};
$('seek').oninput=async()=>{if(busy)return;busy=true;try{await seek(+$('seek').value);$('time').textContent=video.currentTime.toFixed(2)+'s';draw();}catch(e){status(e.message);}finally{busy=false;}};
['title','style','color','position','size','font','guides'].forEach(id=>$(id).addEventListener('input',()=>draw()));
$('suggest').onclick=async()=>{controls(true);const original=video.currentTime;$('samples').replaceChildren();status('Sampling six evenly spaced frames…');try{for(let i=0;i<6;i++){const t=video.duration*(i+1)/7;await seek(t);const c=document.createElement('canvas');c.width=135;c.height=240;const scale=Math.max(c.width/video.videoWidth,c.height/video.videoHeight);c.getContext('2d').drawImage(video,(135-video.videoWidth*scale)/2,(240-video.videoHeight*scale)/2,video.videoWidth*scale,video.videoHeight*scale);const b=document.createElement('button'),im=document.createElement('img');im.src=c.toDataURL('image/jpeg');im.alt='Frame at '+t.toFixed(1)+' seconds';b.append(im,document.createTextNode(t.toFixed(1)+'s'));b.onclick=async()=>{try{await seek(t);$('seek').value=t;$('time').textContent=t.toFixed(2)+'s';draw();}catch(e){status(e.message);}};$('samples').append(b);}await seek(original);draw();status('Pick your expression. These are sampled frames, not AI-ranked selections.');}catch(e){status(e.message);}finally{controls(false);}};
$('save').onclick=async()=>{const data={source:$('source').value,time:video.currentTime,guides:$('guides').checked};for(const id of ['title','style','color','font'])data[id]=$(id).value;for(const id of ['position','size'])data[id]=+$(id).value;try{const r=await fetch('/api/thumbnail',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('Save failed. Please try again.');status('Cover settings saved with this reel.');}catch(e){status(e.message);}};
document.querySelectorAll('.export').forEach(b=>b.onclick=()=>{draw(false);const out=document.createElement('canvas');out.width=1080;out.height=+b.dataset.height;out.getContext('2d').drawImage(canvas,0,(1920-out.height)/2,1080,out.height,0,0,1080,out.height);draw();out.toBlob(blob=>{if(!blob)return status('Export failed. Please try again.');const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`${config.name||'reel'}-cover-1080x${out.height}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status('PNG downloaded. Check the crop before posting.');},'image/png');});
(async()=>{try{config=await(await fetch('/api/thumbnail')).json();for(const name of config.sources){const o=new Option(name,name);$('source').add(o);}if(!config.sources.length){controls(true);return status('No video found. Ask Codex to cut the reel first, or copy your clip into this reel folder as raw.mp4 or raw.mov.');}$('color').value=config.color;for(const [i,font] of config.fonts.entries()){try{const family='Brand-'+font.url.split('/').pop().replace(/\W+/g,'-'),f=new FontFace(family,`url(${JSON.stringify(font.url)})`,{weight:'700'});await f.load();document.fonts.add(f);$('font').add(new Option(font.family+({300:' Light',400:' Regular',700:' Bold'}[font.weight]||''),family));if(i===0)$('font').value=family;}catch{status('A brand font could not load; using system sans.');}}const saved=config.settings||{};for(const id of ['title','style','color','position','size','font'])if(saved[id]!==undefined)$(id).value=saved[id];if(!$('font').value&&$('font').options.length>1)$('font').selectedIndex=1;if(saved.guides!==undefined)$('guides').checked=saved.guides;if(config.sources.includes(saved.source))$('source').value=saved.source;restoreTime=Number(saved.time)||0;$('source').onchange();}catch(e){status('Could not load thumbnail studio: '+e.message);}})();
</script></html>
